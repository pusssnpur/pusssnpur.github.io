/* Layout: one black screen. A quiet white message, darkness, then a red slam and hard flashing cuts to two photos. Single dark look on purpose. */
:root {
  --bg: #000;
  --fg: #ececec;
  --red: #ff1a1a;
  --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--display);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
#stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow: hidden;
}
#msg { margin: 0; opacity: 0; will-change: transform, opacity; text-wrap: balance; overflow-wrap: anywhere; }
#msg.soft { max-width: 17em; font-weight: 700; font-size: clamp(26px, 6.2vw, 58px); line-height: 1.08; letter-spacing: -.015em; color: var(--fg); }
#msg.slam { width: 100%; max-width: 14em; font-weight: 800; font-size: clamp(34px, 11.5vw, 120px); line-height: .94; letter-spacing: -.03em; color: var(--red); }
#msg .ch { display: inline-block; will-change: transform, opacity; }
#cv { position: fixed; inset: 0; z-index: 6; width: 100%; height: 100%; display: block; visibility: hidden; }
.ph { position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%; object-fit: cover; display: block; visibility: hidden; }
</style>

<script>
(function () {
  var T1 = "I told you to scrap it. You wouldnt leave me alone. So i wont let you forget what you did to me.";
  var T2 = "I SHOULD HAVE ABORTED YOU AT THE ABORTION CLINIC 300M AWAY FROM US";
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), msg = $("msg"), A = $("imgA"), B = $("imgB"), C = $("imgC"), cv = $("cv"), ctx = cv.getContext("2d");

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function run(ms, fn) {
    return new Promise(function (res) {
      var t0 = performance.now();
      (function f(now) {
        var t = now - t0;
        if (t >= ms) { fn(ms, 1); res(); return; }
        fn(t, t / ms);
        requestAnimationFrame(f);
      })(t0);
    });
  }
  [A, B, C].forEach(function (im) { if (im.decode) im.decode().catch(function () {}); });

  function show(mode) {
    msg.style.visibility = mode === "T" ? "visible" : "hidden";
    A.style.visibility = mode === "A" ? "visible" : "hidden";
    B.style.visibility = mode === "B" ? "visible" : "hidden";
  }

  async function play() {
    /* 1. the message fades in */
    msg.textContent = T1;
    await run(4000, function (t, p) { msg.style.opacity = p; });
    await wait(5500);

    /* 2. everything goes dark */
    await run(1600, function (t, p) { msg.style.opacity = 1 - p; });
    msg.style.opacity = 0;
    await wait(1500);

    /* 3. the red line slams into the screen */
    msg.className = "slam";
    msg.textContent = T2;
    msg.style.opacity = 1;
    if (reduce) {
      await run(600, function (t, p) { msg.style.opacity = p; });
    } else {
      await run(200, function (t, p) {
        var e = 1 - Math.pow(1 - p, 3);
        msg.style.transform = "scale(" + (2.8 - 1.8 * e) + ")";
      });
      await run(500, function (t, p) {
        var m = (1 - p) * 16;
        stage.style.transform = "translate(" + ((Math.random() - .5) * 2 * m) + "px," + ((Math.random() - .5) * 2 * m) + "px)";
      });
      stage.style.transform = "";
    }
    await wait(1700);

    /* 4. rapid flashing, with the two photos appearing at random in the flashes */
    var half = reduce ? 250 : 500 / 12;   /* 12 flashes per second, 2 on reduced motion */
    var flashing = true, t0 = performance.now(), last = -1;
    (function f(now) {
      if (!flashing) return;
      var s = Math.floor((now - t0) / half);
      if (s !== last) {
        last = s;
        if (s % 2 === 1) show("off");
        else {
          var r = Math.random();
          show(r < 0.2 ? "A" : r < 0.4 ? "B" : "T");
        }
      }
      requestAnimationFrame(f);
    })(t0);
    await wait(reduce ? 6000 : 9000);
    flashing = false;
    show("T");

    /* 5. everything breaks apart, 6. rubbish, 7. the rubbish forms the photo */
    if (!reduce) await shatter();
    await finale();
  }

  /* the red line cracks and every letter flies off */
  function shatter() {
    var text = msg.textContent, spans = [], big = Math.max(innerWidth, innerHeight);
    msg.textContent = "";
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (c === " ") { msg.appendChild(document.createTextNode(" ")); continue; }
      var el = document.createElement("span");
      el.className = "ch"; el.textContent = c; msg.appendChild(el);
      spans.push({ el: el, ang: Math.random() * 6.2832, d: (0.3 + Math.random() * 0.8) * big * 0.7, r: (Math.random() - .5) * 720 });
    }
    return run(380, function () {
      spans.forEach(function (o) { o.el.style.transform = "translate(" + ((Math.random() - .5) * 12) + "px," + ((Math.random() - .5) * 12) + "px)"; });
    }).then(function () {
      return run(1500, function (t, p) {
        var e = p * p;
        spans.forEach(function (o) {
          o.el.style.transform = "translate(" + (Math.cos(o.ang) * o.d * e) + "px," + (Math.sin(o.ang) * o.d * e) + "px) rotate(" + (o.r * e) + "deg)";
          o.el.style.opacity = 1 - e * e;
        });
      });
    });
  }

  /* debris drifts around, then pulls together into the photo */
  var W = 0, H = 0, dpr = 1, done = false;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function drawPhoto(alpha) {
    var sc = Math.max(W / C.naturalWidth, H / C.naturalHeight), dw = C.naturalWidth * sc, dh = C.naturalHeight * sc;
    ctx.globalAlpha = alpha;
    ctx.drawImage(C, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.globalAlpha = 1;
  }
  window.addEventListener("resize", function () {
    if (!done) return;
    size(); ctx.clearRect(0, 0, W, H); drawPhoto(1);
  });

  async function finale() {
    try { await C.decode(); } catch (e) {}
    size();
    msg.style.visibility = "hidden";
    cv.style.visibility = "visible";
    if (reduce) {
      await run(2000, function (t, p) { ctx.clearRect(0, 0, W, H); drawPhoto(p); });
      done = true; return;
    }
    var cell = Math.max(9, Math.sqrt(W * H / 4500)), cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
    var oc = document.createElement("canvas"); oc.width = cols; oc.height = rows;
    var o = oc.getContext("2d");
    var sc = Math.max(cols / C.naturalWidth, rows / C.naturalHeight), dw = C.naturalWidth * sc, dh = C.naturalHeight * sc;
    o.drawImage(C, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
    var px = o.getImageData(0, 0, cols, rows).data;
    var N = cols * rows;
    var RC = [[138, 15, 15], [255, 26, 26], [90, 10, 10], [70, 70, 70], [136, 136, 136], [221, 221, 221]];
    var rx = new Float32Array(N), ry = new Float32Array(N), tx = new Float32Array(N), ty = new Float32Array(N),
        dl = new Float32Array(N), lum = new Float32Array(N), rc = new Uint8Array(N);
    for (var i = 0; i < N; i++) {
      var cx = i % cols, cy = (i / cols) | 0;
      tx[i] = cx * cell; ty[i] = cy * cell;
      rx[i] = Math.random() * W; ry[i] = Math.random() * H;
      dl[i] = Math.random();
      lum[i] = px[i * 4] * 0.3 + px[i * 4 + 1] * 0.59 + px[i * 4 + 2] * 0.11;
      rc[i] = (Math.random() * RC.length) | 0;
    }
    var RUB = 2600, CONV = 5200, FADE = 1500;
    await run(RUB + CONV + FADE, function (t) {
      ctx.clearRect(0, 0, W, H);
      var appear = Math.min(t / 900, 1);
      var conv = Math.min(Math.max((t - RUB) / CONV, 0), 1);
      ctx.globalAlpha = appear;
      ctx.textBaseline = "top";
      for (var i = 0; i < N; i++) {
        var q = Math.min(Math.max((conv - dl[i] * 0.45) / 0.55, 0), 1), e = q * q * (3 - 2 * q);
        rx[i] += (Math.random() - .5) * 7; ry[i] += (Math.random() - .5) * 7;
        if (rx[i] < 0 || rx[i] > W) rx[i] = Math.random() * W;
        if (ry[i] < 0 || ry[i] > H) ry[i] = Math.random() * H;
        var x = rx[i] + (tx[i] - rx[i]) * e, y = ry[i] + (ty[i] - ry[i]) * e;
        var c = RC[rc[i]], g = lum[i];
        var r = c[0] + (g - c[0]) * e, gg = c[1] + (g - c[1]) * e, bb = c[2] + (g - c[2]) * e;
        ctx.fillStyle = "rgb(" + (r | 0) + "," + (gg | 0) + "," + (bb | 0) + ")";
        var sz = cell * (0.3 + 0.75 * e);
        if (e < 0.5 && i % 9 === 0) {
          ctx.font = "500 " + (cell * 1.3) + "px ui-monospace, Menlo, monospace";
          ctx.fillText(G.charAt((i + Math.floor(t / 90)) % G.length), x, y);
        } else {
          ctx.fillRect(x, y, sz, sz);
        }
      }
      ctx.globalAlpha = 1;
      var fa = (t - RUB - CONV) / FADE;
      if (fa > 0) drawPhoto(Math.min(fa, 1));
    });
    ctx.clearRect(0, 0, W, H);
    drawPhoto(1);
    done = true;
  }

  var G = "\u2593\u2592\u2591\u2588\u2580\u2584#@%&$\u00a7\u00a4\u00d7\u00f7\u00b1\u00b6\u0192\u2206\u03a9\u2248\u2260\u221e\u2211\u221a\u222b";
  play();
})();
</script>
