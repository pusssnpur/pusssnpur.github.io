<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { 
            background: #ffffff; 
            color: #ff3399; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 50px; 
            text-transform: uppercase; 
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(255, 51, 153, 0.05) 50%, rgba(0, 204, 102, 0.08) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 99;
        }

        * { color: #ff3399; border-color: #ff3399 !important; }
        .container { max-width: 800px; position: relative; z-index: 100; }
        
        h1 { font-size: 6rem; margin: 0; text-shadow: 2px 2px #00cc66; }
        
        /* Boxes - Side by Side */
        .releases-wrapper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
        }

        .box { 
            border: 2px solid #ff3399; 
            padding: 20px; 
            font-weight: bold; 
            background: #fff5f8; 
            flex: 1;
            min-width: 280px;
        }
        
        .box-title { font-size: 0.8rem; margin-bottom: 10px; color: #00cc66; }
        .release-item { margin-bottom: 15px; font-size: 1.5rem; }
        
        /* Music Embeds Horizontal Layout */
        .music-embed {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        /* Artifacts */
        .artifact { position: fixed; pointer-events: none; z-index: 999; opacity: 0.6; }

        a { text-decoration: underline; color: #ff3399; }
        a:hover { background: #00cc66; color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>LOCALWHO</h1>

        <div class="releases-wrapper">
            <section class="box" style="border-color: #00cc66 !important;">
                <div class="box-title">// RELEASES</div>
                <div class="release-item">ABORTION // 2026.05.25</div>
                <div class="release-item" style="color: #00cc66;">ILY4EVA // 2026.07.24</div>
                <div class="release-item" style="color: #00cc66;">ABORTION CLINIC 300M AWAY FROM YOU // SOON</div>
            </section>
        </div>

        <section class="music-embed">
            <iframe style="border: 0; width: 350px; height: 470px;" src="https://bandcamp.com/EmbeddedPlayer/album=2154375449/size=large/bgcol=ffffff/linkcol=f171a2/tracklist=false/transparent=true/" seamless><a href="https://localwho.bandcamp.com/album/ily4eva">ily4eva by LOCALWHO</a></iframe>
            <iframe style="border: 0; width: 350px; height: 470px;" src="https://bandcamp.com/EmbeddedPlayer/album=769994563/size=large/bgcol=333333/linkcol=e32c14/tracklist=false/transparent=true/" seamless></iframe>
        </section>

        <section class="socials-nav" style="margin-top: 50px; display: flex; flex-wrap: wrap; gap: 20px; font-weight: bold;">
            <a href="https://www.tiktok.com/@localwho">TIKTOK</a>
            <a href="https://bsky.app/profile/localwho.bsky.social">BLUESKY</a>
            <a href="https://www.instagram.com/divacharlizhekeha/">INSTAGRAM</a>
            <a href="https://x.com/benxiee_twt">X/TWITTER</a>
        </section>

        <nav style="margin-top: 60px;">
            <a href="index.html"><< BACK TO LABEL</a>
        </nav>
    </div>

    <script>
        function spawnArtifact() {
            const colors = ['#ff3399', '#00cc66', '#ff66b2', '#2ecc71', '#ff1493'];
            const art = document.createElement('div');
            art.className = 'artifact';
            art.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            art.style.top = Math.random() * 100 + 'vh';
            art.style.left = Math.random() * 100 + 'vw';
            art.style.width = Math.random() * 200 + 50 + 'px';
            art.style.height = Math.random() * 100 + 20 + 'px';
            document.body.appendChild(art);
            setTimeout(() => art.remove(), Math.random() * 500 + 100);
            setTimeout(spawnArtifact, Math.random() * 1000 + 200);
        }
        spawnArtifact();
        spawnArtifact();
    </script>
</body>
</html>
