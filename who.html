<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>who</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen black stage. A warning gate, then the message, then a canvas for the falling tracklist. Single dark look on purpose. */
:root {
  --bg: #000;
  --fg: #ececec;
  --red: #ff1a1a;
  --dim: #8a8a8a;
  --display: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
:root.f1 { --bg: #000; --fg: var(--red); }
:root.f2 { --bg: var(--red); --fg: #000; }
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  font-family: var(--display);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity: 0;
  will-change: transform, opacity;
}
#msg {
  margin: 0;
  max-width: 15em;
  font-weight: 800;
  font-size: clamp(30px, 7.4vw, 76px);
  line-height: 1.02;
  letter-spacing: -.02em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  color: var(--fg);
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: pre-line; }
</style>

<div class="sr" id="sr"></div>
<div id="stage" aria-hidden="true"><p id="msg"></p></div>
<canvas id="cv" aria-hidden="true"></canvas>

<script>
(function () {
  var ORIG = "I never forgave you. You wont remember it. I will. And i will make sure you wont forget it";
  var LIST = "WHO\ndisk1\nabortion\nclinic\nvibrator\nnever wanted u\nits like\nin the bath\nhaus musik\npussyfingering(1)\npussyfingering(2)\n\ndisk2\ndildo\ndaddy\ni want it / i got it\n\ndisk3\nstart\nend\nfinish\nlife\ndeath\nblood\ndrink";
  var G = "▓▒░█▀▄#@%&$§¤×÷±¶ƒ∆Ω≈≠∞∑√∫xzqkjw";
  var MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var calm = reduce;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement, stage = $("stage"), msg = $("msg"), cv = $("cv"), ctx = cv.getContext("2d");
  $("sr").textContent = ORIG + "\n\n" + LIST;
  msg.textContent = ORIG;

  function rnd() { return G.charAt(Math.random() * G.length | 0); }
  function mapChars(s, fn) { return s.replace(/\S/g, fn); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function run(ms, fn) {
    return new Promise(function (res) {
      var t0 = performance.now();
      (function f(now) {
        var t = now - t0;
        if (t >= ms) { fn(ms, 1); res(); return; }
        fn(t, t / ms);
        requestAnimationFrame(f);
      })(t0);
    });
  }

  /* ---------- falling letters that form the tracklist ---------- */
  var W = 0, H = 0, dpr = 1, parts = [], strays = [], finalDone = false;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = "500 100px " + MONO;
    var cwr = ctx.measureText("0").width / 100 || 0.6;
    var lines = LIST.split("\n"), HEAD = 2.4, LH = 1.35, maxChars = 0, units = 0;
    lines.forEach(function (l, i) { maxChars = Math.max(maxChars, l.length * (i === 0 ? HEAD : 1)); units += (i === 0 ? HEAD : 1) * LH; });
    var fs = Math.min((H * 0.86) / units, (W - 40) / (maxChars * cwr));
    var blockW = maxChars * cwr * fs;
    var x0 = Math.max(16, (W - blockW) / 2);
    var y = (H - units * fs) / 2, k = 0;
    lines.forEach(function (l, i) {
      var size = fs * (i === 0 ? HEAD : 1), lh = size * LH, base = y + lh * 0.8;
      for (var c = 0; c < l.length; c++) {
        if (l.charAt(c) === " ") continue;
        var p = parts[k];
        if (!p) {
          p = parts[k] = { k: k, delay: 0, dur: 1600 + Math.random() * 1200, y0: 0 };
        }
        p.ch = l.charAt(c); p.size = size; p.tx = x0 + c * cwr * size; p.ty = base;
        k++;
      }
      y += lh;
    });
    parts.length = k;
    var maxTy = H;
    parts.forEach(function (p) {
      if (!p.seeded) {
        p.seeded = true;
        p.delay = (p.ty / maxTy) * 9000 + Math.random() * 3000;
        p.y0 = -p.size * 2 - Math.random() * 80;
      }
    });
  }

  function drawFinal(alpha) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = "#ececec";
    ctx.textBaseline = "alphabetic";
    parts.forEach(function (p) {
      ctx.font = "500 " + p.size + "px " + MONO;
      ctx.fillText(p.ch, p.tx, p.ty);
    });
    ctx.globalAlpha = 1;
  }

  function form() {
    layout();
    if (reduce) {
      return run(1600, function (t, p) { drawFinal(p); }).then(function () { finalDone = true; });
    }
    return new Promise(function (res) {
      var t0 = performance.now(), last = t0;
      (function f(now) {
        var t = now - t0, dt = Math.min((now - last) / 1000, .05);
        last = now;
        ctx.clearRect(0, 0, W, H);
        ctx.textBaseline = "alphabetic";
        var done = true;
        parts.forEach(function (p) {
          var u = (t - p.delay) / p.dur;
          if (u < 0) { done = false; return; }
          ctx.font = "500 " + p.size + "px " + MONO;
          if (u >= 1) { ctx.fillStyle = "#ececec"; ctx.fillText(p.ch, p.tx, p.ty); return; }
          done = false;
          var y = p.y0 + (p.ty - p.y0) * u * u;
          var show = u >= 0.82 ? p.ch : G.charAt((Math.floor(t / 90) + p.k * 7) % G.length);
          ctx.fillStyle = u >= 0.82 ? "#ececec" : "rgba(255,42,42," + (0.55 + u * 0.4) + ")";
          ctx.fillText(show, p.tx, y);
        });
        /* stray garbage that falls past and never lands */
        if (t < 10500 && Math.random() < dt * 14) {
          strays.push({ x: Math.random() * W, y: -20, v: 180 + Math.random() * 360, s: 12 + Math.random() * 16, k: Math.random() * 100 | 0 });
        }
        for (var i = strays.length - 1; i >= 0; i--) {
          var s = strays[i];
          s.y += s.v * dt;
          if (s.y > H + 30) { strays.splice(i, 1); continue; }
          ctx.font = "500 " + s.s + "px " + MONO;
          ctx.fillStyle = "rgba(255,42,42,.5)";
          ctx.fillText(G.charAt((Math.floor(t / 110) + s.k) % G.length), s.x, s.y);
        }
        if (done && !strays.length) { finalDone = true; drawFinal(); res(); return; }
        requestAnimationFrame(f);
      })(t0);
    });
  }

  window.addEventListener("resize", function () {
    if (!W) return;
    layout();
    if (finalDone) drawFinal();
  });

  /* ---------- the sequence ---------- */
  async function play() {
    var hz = calm ? 2 : 12;           /* flashes per second */
    var half = 500 / hz;               /* ms per black or red phase */
    var flash = function (t) { root.className = (Math.floor(t / half) % 2) ? "f2" : "f1"; };

    /* 1. message fades in, then everything stops */
    await run(4000, function (t, p) { stage.style.opacity = p; });
    await wait(10000);

    /* 2. text turns into question marks flashing black and red */
    msg.textContent = mapChars(ORIG, function () { return "?"; });
    await run(3600, function (t) { flash(t); });

    /* 3. question marks turn into flashing garbage */
    var last = -1;
    await run(3200, function (t) {
      flash(t);
      var s = Math.floor(t / half);
      if (s !== last) { last = s; msg.textContent = mapChars(ORIG, rnd); }
    });

    /* 4. everything slides sideways, then slowly zooms out and fades down */
    root.className = "";
    msg.style.color = "#ff2a2a";
    var last2 = -1, step = calm ? 250 : 90, SIDE = 0.15, TOTAL = 8000;
    await run(TOTAL, function (t, p) {
      var a = Math.min(p / SIDE, 1), slide = a * a * (3 - 2 * a);          /* smooth 0..1 */
      var z = Math.max(0, (p - SIDE * 0.6) / (1 - SIDE * 0.6));            /* slow zoom starts as the slide ends */
      var zoom = 1 - Math.pow(1 - z, 2);                                   /* eases out: slow at the end */
      var x = slide * window.innerWidth * (reduce ? 0 : 0.3);
      stage.style.transform = "translateX(" + x + "px) skewX(" + (reduce ? 0 : -slide * 16) + "deg) scale(" + (1 - 0.97 * zoom) + ")";
      stage.style.opacity = 1 - Math.pow(Math.max(0, (z - 0.3) / 0.7), 1.3);
      var s = Math.floor(t / step);
      if (s !== last2) { last2 = s; msg.textContent = mapChars(ORIG, rnd); }
    });
    stage.style.display = "none";
    await wait(700);

    /* 5. garbage letters fall and slowly form the tracklist */
    await form();
  }

  play();
})();
</script>

</html>
